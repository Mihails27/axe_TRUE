<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="lgIcon.png">
    <title>IP Rights | Layer Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: 'Cal Sans'; src: local('Cal Sans'); font-weight: normal; }
        :root { --dark: #050506; --cyan: #00E5FF; --gray: #8892B0; }
        body { background: var(--dark); color: #fff; font-family: 'Cal Sans', 'Roboto', sans-serif; padding: 80px 20px; line-height: 1.6; animation: slideUp 1s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 3rem; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .back { color: var(--cyan); text-decoration: none; font-size: 0.8rem; margin-bottom: 30px; display: block; }
        .evo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; margin: 60px 0; }
        .img-frame { background: #111; padding: 8px; border-radius: 12px; border: 1px solid #333; transition: 0.5s; overflow: hidden; line-height: 0; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .img-frame img { width: 100%; border-radius: 6px; filter: contrast(1.1) brightness(0.8); transition: 0.5s; }
        .img-frame:hover { border-color: var(--cyan); transform: scale(1.05); }
        .img-frame:hover img { filter: contrast(1.2) brightness(1.1); }
        .legal-item { margin-bottom: 25px; border-left: 3px solid var(--cyan); padding-left: 20px; }
        footer { text-align: center; margin-top: 100px; opacity: 0.3; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← RETURN TO CORE</a>
        <h1>Intellectual Property</h1>
        <div class="evo-grid">
            <div class="img-frame"><img src="evo_2.png" alt="2.0"></div>
            <div class="img-frame"><img src="evo_3.png" alt="3.0"></div>
            <div class="img-frame"><img src="evo_25.png" alt="25"></div>
            <div class="img-frame"><img src="evo_axe.png" alt="Axe"></div>
        </div>
        <div class="legal-item"><h3>UI Architecture</h3><p class="ru">Вертикальная монолитная панель — эксклюзивный паттерн Layer Group.</p></div>
        <footer>© 2026 Layer Group | Made in Latvia</footer>
    </div>
</body>
</html>
