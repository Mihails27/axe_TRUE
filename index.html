<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="lgIcon.png">
    <title>Layer Group | AxeOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: 'Cal Sans'; src: local('Cal Sans'), local('CalSans-SemiBold'); font-weight: normal; }
        :root { --dark: #0B0C10; --gray: #8892B0; --cyan: #00E5FF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark) url('fon.png') no-repeat center center fixed; background-size: cover; color: #fff; font-family: 'Cal Sans', 'Roboto', sans-serif; overflow-x: hidden; }
        p, span, .ru { font-family: 'Roboto', sans-serif; font-weight: 700; }
        h1, h2, h3, .en { font-weight: normal; text-transform: uppercase; }

        header { position: fixed; top: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(11, 12, 16, 0.7); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        header img { height: 40px; }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .hero img { width: 280px; margin-bottom: 20px; animation: float 4s infinite ease-in-out; }
        .hero h1 { font-size: 5rem; letter-spacing: -2px; line-height: 1; }
        .hero p { font-size: 1.2rem; color: var(--gray); margin: 20px 0 40px; max-width: 600px; }

        /* ГРУППА КНОПОК */
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 18px 40px; background: #fff; color: var(--dark); text-decoration: none; border-radius: 4px; transition: 0.3s; font-family: 'Cal Sans'; font-size: 1rem; }
        .btn:hover { background: var(--cyan); box-shadow: 0 0 30px rgba(0,229,255,0.5); transform: translateY(-3px); }
        .btn-secondary { background: transparent; color: #fff; border: 1.5px solid #fff; }

        .architecture { padding: 80px 20px; text-align: center; background: rgba(0,0,0,0.4); }
        .arch-grid { display: flex; justify-content: center; gap: 40px; margin-top: 40px; flex-wrap: wrap; }
        .arch-item h4 { color: var(--cyan); margin-bottom: 10px; font-size: 1.5rem; }

        footer { padding: 60px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; color: var(--gray); }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* МОБИЛЬНАЯ ОПТИМИЗАЦИЯ ДЛЯ ГЛАВНОЙ */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .hero h1 { font-size: 3rem; }
            .hero img { width: 200px; }
            .hero p { font-size: 1rem; }
            header .en { display: none; } /* Скрываем девиз на мелких экранах */
        }
    </style>
</head>
<body>
    <header><img src="lg.png" alt="LG"><div class="en" style="color: var(--gray);">Engineering Tomorrow.</div></header>
    <section class="hero">
        <img src="axe.png" alt="Axe">
        <h1>Axe One</h1>
        <p>CREATIVEST: Вторая итерация логического ядра. Система, восстающая из пепла для достижения абсолютной чистоты.</p>
        <div class="btn-group">
            <a href="explore.html" class="btn">Explore Axe One</a>
            <a href="test.html" class="btn btn-secondary">Interface Test</a>
        </div>
    </section>
    <section class="architecture">
        <h2 class="en">System Architecture</h2>
        <div class="arch-grid">
            <div class="arch-item"><h4>VBA Core</h4><p>Логика</p></div>
            <div class="arch-item"><h4>Kiosk 2.0</h4><p>Изоляция</p></div>
            <div class="arch-item"><h4>ActiveX</h4><p>Ввод данных</p></div>
        </div>
    </section>
    <footer><p>© 2026 Layer Group. Made in Latvia.</p></footer>
</body>
</html>
