<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="lgIcon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axe One UI Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Cal Sans';
            src: local('Cal Sans'), local('CalSans-SemiBold');
            font-weight: normal;
        }

        :root {
            --bg: #070708;
            --monolith-gray: #333333;
            --empty-gray: #424242;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg) url('fon.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Cal Sans', sans-serif;
            overflow: hidden;
        }

        /* НЕОНОВАЯ АУРА ОТЗЫВА */
        #aura-feedback {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; transition: all 0.8s ease;
            z-index: 1; opacity: 0;
        }

        /* ШИРОКИЙ МОНОЛИТ СЛЕВА */
        .monolith {
            position: relative;
            left: 30px;
            width: 480px; /* Ширина как на твоем изображении */
            height: 95vh;
            background: var(--monolith-gray);
            border: 2px solid #000;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* СЕТКА ПРИЛОЖЕНИЙ (ВЕРХНЯЯ ЧАСТЬ) */
        .bento-header {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 140px);
            gap: 2px; /* Тонкие линии-разделители */
            background: #000; /* Цвет линий */
        }

        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 15px;
            transition: 0.3s ease;
            cursor: pointer;
        }

        /* СТИЛИ КОНКРЕТНЫХ ПЛИТОК */
        .t-req { background: #132754; } /* Requisitio */
        .t-lit { background: #F2A800; } /* Littera */
        .t-cop { background: #8BA870; } /* Copia */
        .t-mus { background: #F0F263; } /* Musicam */
        .t-axi { background: #636363; } /* Axis */
        .t-dep { background: #2D9CDB; } /* Depromere */

        /* ВНУТРЕННИЕ ЭЛЕМЕНТЫ (ИМИТАЦИЯ ТВОЕГО ДИЗАЙНА) */
        .inner-search { width: 80%; height: 25px; background: #fff; border-radius: 20px; margin-bottom: 30px; border: 1px solid #000; }
        .inner-doc { width: 60px; height: 70px; background: #fff; border: 2px solid #000; margin-bottom: 10px; position: relative; }
        .inner-doc::after { content: ''; position: absolute; top: 10px; left: 10px; width: 40px; height: 30px; border-top: 4px solid #000; border-bottom: 4px solid #000; }
        .inner-calc { width: 80%; height: 40px; background: #fff; border: 2px solid #000; margin-bottom: 10px; color: #000; padding: 5px; font-size: 1.2rem; }
        .inner-toggle { width: 60px; height: 30px; background: #00FF64; border-radius: 20px; border: 2px solid #000; margin-bottom: 5px; position: relative; }
        .inner-toggle::after { content: ''; position: absolute; right: 5px; top: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; border: 1px solid #000; }
        .inner-note { font-size: 4rem; color: #000; line-height: 1; margin-bottom: 5px; }

        .app-name {
            font-family: 'Cal Sans';
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        .t-mus .app-name, .t-axi .app-name { color: #000; text-shadow: none; }

        /* ЭФФЕКТ ЗАТЕМНЕНИЯ (ТВОЯ ФИШКА) */
        .bento-header:hover .tile { opacity: 0.3; filter: grayscale(0.5); }
        .bento-header .tile:hover { opacity: 1; filter: grayscale(0); transform: scale(1.02); z-index: 20; }

        /* ПУСТАЯ ОБЛАСТЬ СНИЗУ */
        .empty-area {
            flex-grow: 1;
            background: var(--empty-gray);
            margin: 5px;
            border-radius: 10px;
        }

        /* КНОПКИ ЛАЙКОВ */
        .feedback-bar {
            position: fixed; bottom: 30px; right: 40px;
            background: rgba(0,0,0,0.8); padding: 15px 30px;
            border-radius: 100px; display: flex; gap: 20px; z-index: 100;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }

        .v-btn {
            font-family: 'Roboto'; font-weight: 700;
            border: none; background: none; color: #fff;
            cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .v-btn:hover { transform: translateY(-5px); text-shadow: 0 0 10px #fff; }

        .exit { position: fixed; top: 20px; right: 30px; color: #fff; text-decoration: none; font-size: 0.8rem; opacity: 0.4; }
    </style>
</head>
<body>

    <div id="aura-feedback"></div>
    <a href="index.html" class="exit">EXIT_PREVIEW</a>

    <div class="monolith">
        <div class="bento-header">
            <!-- Requisitio -->
            <div class="tile t-req">
                <div class="inner-search"></div>
                <div class="app-name">Requisitio</div>
            </div>
            <!-- Littera -->
            <div class="tile t-lit">
                <div class="inner-doc"></div>
                <div class="app-name">Littera</div>
            </div>
            <!-- Copia -->
            <div class="tile t-cop">
                <div class="inner-calc">123</div>
                <div class="app-name">Copia</div>
            </div>
            <!-- Musicam -->
            <div class="tile t-mus">
                <div class="inner-note">♫</div>
                <div class="app-name">Musicam</div>
            </div>
            <!-- Axis -->
            <div class="tile t-axi">
                <div class="inner-toggle"></div>
                <div class="app-name">Axis</div>
            </div>
            <!-- Depromere -->
            <div class="tile t-dep">
                <div class="app-name">Depromere</div>
            </div>
        </div>
        <div class="empty-area"></div>
    </div>

    <div class="feedback-bar">
        <button class="v-btn" style="color:#00FF64" onclick="vote('green')">ЛАЙК</button>
        <button class="v-btn" style="color:#888" onclick="vote('gray')">НЕЙТРАЛЬНО</button>
        <button class="v-btn" style="color:#FF3333" onclick="vote('red')">ДИЗЛАЙК</button>
    </div>

    <script>
        function vote(type) {
            const aura = document.getElementById('aura-feedback');
            aura.style.opacity = "1";
            let color;
            if(type === 'green') color = "rgba(0, 255, 100, 0.35)";
            else if(type === 'gray') color = "rgba(128, 128, 128, 0.2)";
            else if(type === 'red') color = "rgba(255, 50, 50, 0.35)";
            
            aura.style.background = `radial-gradient(circle at 60% 50%, ${color} 0%, rgba(11, 12, 16, 0) 70%)`;
        }
    </script>
</body>
</html>
